# Gorse (classical collaborative filtering and item-to-item similarity). No LLM, no paid API, no embeddings service.
# Start:  docker compose -f infra/gorse/docker-compose.yml up -d
# Then set in .env.local:  GORSE_URL=http://localhost:8087   GORSE_API_KEY=ared-local-key
# Dashboard: http://localhost:8088   Remove GORSE_URL and Following keeps working on the native ranker.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: gorse, POSTGRES_PASSWORD: gorse_pass, POSTGRES_DB: gorse }
    volumes: [gorse_pg:/var/lib/postgresql/data]
  worker:
    image: zhenghaoz/gorse-worker
    restart: unless-stopped
    command: ["--master-host", "master", "--master-port", "8086", "--http-host", "0.0.0.0", "--http-port", "8089"]
    depends_on: [master]
  server:
    image: zhenghaoz/gorse-server
    restart: unless-stopped
    ports: ["8087:8087"]
    command: ["--master-host", "master", "--master-port", "8086", "--http-host", "0.0.0.0", "--http-port", "8087"]
    depends_on: [master]
  master:
    image: zhenghaoz/gorse-master
    restart: unless-stopped
    ports: ["8086:8086", "8088:8088"]
    command: ["-c", "/etc/gorse/config.toml"]
    environment:
      GORSE_CACHE_STORE: redis://redis:6379
      GORSE_DATA_STORE: postgres://gorse:gorse_pass@postgres:5432/gorse?sslmode=disable
    volumes: ["./config.toml:/etc/gorse/config.toml:ro"]
    depends_on: [redis, postgres]
volumes:
  gorse_pg:
