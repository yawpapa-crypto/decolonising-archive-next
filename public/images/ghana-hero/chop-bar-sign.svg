<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif">
  <!-- White background board -->
  <rect width="900" height="700" fill="#F5F3EE"/>
  <!-- Slight texture -->
  <rect width="900" height="700" fill="none" stroke="#D8D0C0" stroke-width="6"/>
  <!-- Horizontal register lines (subtle) -->
  <line x1="0" y1="100" x2="900" y2="100" stroke="#E0D8CC" stroke-width="1"/>
  <line x1="0" y1="220" x2="900" y2="220" stroke="#E0D8CC" stroke-width="1"/>
  <line x1="0" y1="340" x2="900" y2="340" stroke="#E0D8CC" stroke-width="1"/>
  <line x1="0" y1="460" x2="900" y2="460" stroke="#E0D8CC" stroke-width="1"/>
  <!-- "MAXIMUM ART" — small, centred, black, hand-lettered feel -->
  <text x="450" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="#1A1A1A"
        font-family="'Courier New', monospace" letter-spacing="6">MAXIMUM ART</text>
  <!-- "DON'T MIND YOUR WIFE" — large, blue -->
  <text x="450" y="140" text-anchor="middle" font-size="70" font-weight="900" fill="#1565C0"
        font-family="'Arial Black', Impact, sans-serif" letter-spacing="-1">DON'T MIND</text>
  <text x="450" y="215" text-anchor="middle" font-size="70" font-weight="900" fill="#1565C0"
        font-family="'Arial Black', Impact, sans-serif" letter-spacing="-1">YOUR WIFE</text>
  <!-- "CHOP BAR" — large, black -->
  <text x="310" y="305" text-anchor="middle" font-size="90" font-weight="900" fill="#1A1A1A"
        font-family="'Arial Black', Impact, sans-serif">CHOP BAR</text>
  <!-- Red arrow -->
  <line x1="590" y1="275" x2="700" y2="275" stroke="#CC1111" stroke-width="16" stroke-linecap="round"/>
  <polygon points="700,255 740,275 700,295" fill="#CC1111"/>
  <!-- "ABEN WO HA" — red, Twi text -->
  <text x="450" y="385" text-anchor="middle" font-size="58" font-weight="900" fill="#CC1111"
        font-family="'Arial Black', Impact, sans-serif">ABEN WƆ HA</text>
  <!-- Menu items — green, left-centre -->
  <text x="480" y="455" text-anchor="middle" font-size="44" font-weight="bold" fill="#2E7D32"
        font-family="'Arial Black', Impact, sans-serif">BANKU</text>
  <text x="480" y="510" text-anchor="middle" font-size="44" font-weight="bold" fill="#2E7D32"
        font-family="'Arial Black', Impact, sans-serif">FUFU</text>
  <text x="480" y="565" text-anchor="middle" font-size="44" font-weight="bold" fill="#2E7D32"
        font-family="'Arial Black', Impact, sans-serif">DRINKS <tspan fill="#CC1111">Etc.</tspan></text>
  <!-- ── Bowl illustration (left side) ── -->
  <!-- Bowl outer -->
  <ellipse cx="170" cy="520" rx="130" ry="80" fill="#2C1A0A"/>
  <!-- Bowl inner (soup) -->
  <ellipse cx="170" cy="508" rx="118" ry="68" fill="#D4720A"/>
  <!-- Lighter inner soup highlight -->
  <ellipse cx="170" cy="500" rx="100" ry="55" fill="#E88C20" opacity="0.6"/>
  <!-- Fish in soup -->
  <ellipse cx="145" cy="498" rx="38" ry="16" fill="#B0B0A0" transform="rotate(-15,145,498)"/>
  <polygon points="110,496 95,484 95,510" fill="#909090"/>
  <!-- Clam/shellfish -->
  <ellipse cx="200" cy="510" rx="25" ry="18" fill="#D0C890"/>
  <line x1="177" y1="510" x2="223" y2="510" stroke="#A0945A" stroke-width="2"/>
  <!-- Bowl rim highlight -->
  <ellipse cx="170" cy="440" rx="130" ry="20" fill="#1A0A00" opacity="0.4"/>
  <!-- ── Bottle illustration (right side) ── -->
  <!-- Guinness-style green bottle -->
  <rect x="760" y="380" width="55" height="200" rx="12" fill="#1B5E20"/>
  <!-- Bottle neck -->
  <rect x="772" y="340" width="30" height="55" rx="8" fill="#1B5E20"/>
  <rect x="776" y="330" width="22" height="20" rx="4" fill="#1B5E20"/>
  <!-- Bottle label -->
  <rect x="762" y="430" width="51" height="80" rx="4" fill="#F5F3EE"/>
  <circle cx="787" cy="470" r="24" fill="#1B5E20"/>
  <!-- Harp symbol (simplified) -->
  <path d="M779,455 Q775,470 779,488 Q787,492 795,488 Q799,470 795,455" stroke="#FFD700" stroke-width="2.5" fill="none"/>
  <!-- Glass of beer -->
  <rect x="830" y="430" width="52" height="130" rx="4" fill="#F5C518" opacity="0.8"/>
  <rect x="828" y="426" width="56" height="16" rx="4" fill="#FFFDE7"/>
  <line x1="830" y1="442" x2="882" y2="442" stroke="#F5C518" stroke-width="2"/>
</svg>