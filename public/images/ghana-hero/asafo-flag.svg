  <line x1="465" y1="420" x2="472" y2="445" stroke="#8B1A1A" stroke-width="8" stroke-linecap="round"/>
  <line x1="465" y1="420" x2="485" y2="440" stroke="#8B1A1A" stroke-width="8" stroke-linecap="round"/>
